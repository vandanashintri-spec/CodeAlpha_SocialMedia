{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-card">
    <div class="auth-mark">c</div>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Forgot your password?</h1>
    <p class="form-intro">Enter your account email and we’ll send a secure reset link.</p>
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="button button-wide" type="submit">Send reset link</button></form>
    <p class="auth-switch"><a href="{% url 'login' %}">Back to log in</a></p>
  </section>
</div>
{% endblock %}
