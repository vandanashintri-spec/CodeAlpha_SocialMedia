{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="auth-wrap">
  <section class="auth-card">
    <div class="auth-mark">c</div>
    <p class="eyebrow">ACCOUNT RECOVERY</p>
    <h1>Check your inbox.</h1>
    <p class="form-intro">If an active account matches that email, a secure password reset link is on its way.</p>
    <p class="auth-switch"><a href="{% url 'login' %}">Back to log in</a></p>
  </section>
</div>
{% endblock %}
